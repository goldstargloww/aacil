  <title>AAC Image Library</title>

  <!-- The style.css file allows you to change the look of your web pages.
         If you include the next line in all your web pages, they will all share the same look.
         This makes it easier to make new pages for your site. -->
  <link href="/style.css" rel="stylesheet" type="text/css" media="all">
  <style>

 body {
      background-color: #cccccc;
    }
    
    /* Responsive layout - when the screen is less than 600px wide, make the three columns stack on top of each other instead of next to each other */
    @media screen and (max-width: 600px) {
      .column {
        width: 100%;
      }
    }

    .row {
      display: flex;
    }

    .column {
      flex: 33%;
    }


    figure {
      border: 1px #cccccc solid;
      padding: 4px;
      margin: auto;
    }

    figcaption {
      background-color: black;
      color: white;
      padding: 2px;
      text-align: center;
    }
  </style>
</head>

<body>

    <p><a href="/Disability/specific_disabilities.html">back.</a></p>

  <center>


    <div class="row">
      <div class="column">






        <figure>
          <img src="/Disability/s/scoliosis.png" height="300" alt="a human spine that curves in an 's' shape.">
          <figcaption>
            <span class="caption">scoliosis</span>
            <span class="credit"> | By M.</span>
          </figcaption>
        </figure>
        
        <figure>
          <img src="/Disability/scoliosis/infantile scoliosis dusty.png" height="300"
            alt="A curving spine next to a swaddled infant.">
          <figcaption>
            <span class="caption">infantile scoliosis</span>
            <span class="credit"> | By Dusty.</span>
          </figcaption>
        </figure>

        <figure>
          <img src="/Disability/s/dextroscoliosis dusty.png" height="300" alt="A yellow person in gray pants with a spine curving far to the left, and a pink arrow pointing into the curve.">
          <figcaption>
            <span class="caption">dextroscoliosis</span>
            <span class="credit"> | By Dusty.</span>
          </figcaption>
        </figure>
        




      </div>
      <div class="column">





        <figure>
          <img src="/Disability/scoliosis/adolescent scoliosis dusty.png" height="300"
            alt=" A curving spine next to an emo teenager with dyed hair using a cane.">
          <figcaption>
            <span class="caption">adolescent scoliosis</span>
            <span class="credit"> | By Dusty.</span>
          </figcaption>
        </figure>

        <figure>
          <img src="/Disability/s/kEDS ot.png" height="300"
            alt="on the top is a curving vertebrae. on the bottom right corner is a white ribbon with black stripes next to the bust of a zebra, who has a white body with black stripes">
          <figcaption>
            <span class="caption">kyphoscoliotic elhers-danlos syndrome (kEDS)</span>
            <span class="credit"> | By Ottertime.</span>
          </figcaption>
        </figure>

    <figure>
          <img src="/Disability/s/levoscoliosis dusty.png" height="300" alt="A yellow person in gray pants with a spine curving far to the right, and a pink arrow pointing into the curve.">
          <figcaption>
            <span class="caption">levoscoliosis</span>
            <span class="credit"> | By Dusty.</span>
          </figcaption>
        </figure>
        




      </div>
      <div class="column">



        <figure>
          <img src="/Disability/scoliosis/adult idiopathic scoliosis.png" height="300"
            alt="A curving spine next to an adult in a wheelchair.">
          <figcaption>
            <span class="caption">adult (idiopathic) scoliosis</span>
            <span class="credit"> | By Dusty.</span>
          </figcaption>
        </figure>
        
        <figure>
          <img src="/Disability/scoliosis/juvenile scoliosis dusty.png" height="300"
            alt="A curving spine next to a child in overalls and a propeller hat, using an anterior walker.">
          <figcaption>
            <span class="caption">juvenile scoliosis</span>
            <span class="credit"> | By Dusty.</span>
          </figcaption>
        </figure>





      </div>
    </div>

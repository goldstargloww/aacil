<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="/favicon.png" />
  <title>AAC Image Library</title>

  <!-- The style.css file allows you to change the look of your web pages.
         If you include the next line in all your web pages, they will all share the same look.
         This makes it easier to make new pages for your site. -->
  <link href="/style.css" rel="stylesheet" type="text/css" media="all">
  <style>

 body {
      background-color: #cccccc;
    }
    
    /* Responsive layout - when the screen is less than 600px wide, make the three columns stack on top of each other instead of next to each other */
    @media screen and (max-width: 600px) {
      .column {
        width: 100%;
      }
    }

    .row {
      display: flex;
    }

    .column {
      flex: 33%;
    }


    figure {
      border: 1px #cccccc solid;
      padding: 4px;
      margin: auto;
    }

    figcaption {
      background-color: black;
      color: white;
      padding: 2px;
      text-align: center;
    }
  </style>
</head>

<body>

    <p><a href="/Disability/disability.html">back.</a></p>

  <center>


    <div class="row">
      <div class="column">



        <figure>
          <img src="/Phrases/cooking is my spin.png" height="300" alt="a yellow face looking delightedly up at a pan of ambiguous food. There’s also a heart next to the face and a red infinity sign, showing that it’s an autistic special interest.">
          <figcaption>
            <span class="caption">cooking is my special interest</span>
            <span class="credit"> | by Rae.</span>
          </figcaption>
        </figure>
        
        <figure>
          <img src="/Phrases/i'm autistic petri.png" height="300" alt=" A drawing of a nondescript yellow person using a simplified grey active wheelchair. Next to them is a big white circle containing the autism infinity symbol in red. Two black arrows point from the circle to the person">
          <figcaption>
            <span class="caption">I'm autistic</span>
            <span class="credit"> | by Petri.</span>
          </figcaption>
        </figure>



        








      </div>
      <div class="column">








        <figure>
          <img src="/Phrases/i'm autistic m.png" height="300" alt="a yellow figure looking up at a gold infinity sign and smiling. they have pointed ears, straight dark brown hair, glasses, and stubble. their smile is lopsided, and they're wearing a dark green tshirt, silver clip-on earrings, and an AAC device with a shoulder strap.">
          <figcaption>
            <span class="caption">I'm Autistic</span>
            <span class="credit"> | by M.</span>
          </figcaption>
        </figure>






      </div>
      <div class="column">




  
        <figure>
          <img src="/Phrases/cats are my special interest budget.png" height="300" alt="a yellow person happily talking. Next to them are three speech bubbles with various breeds of cats in them. in the top bubble above them is an orange tabby tail, the biggest bubble has a grey cat bust, and the last bubble has half the face of a siamese and its whiskers.">
          <figcaption>
            <span class="caption">cats are my special interest</span>
            <span class="credit"> | by RC.</span>
          </figcaption>
        </figure>

   
  
        <figure>
          <img src="/Phrases/tornados are my special interest budget.png" height="300" alt="a yellow person happily talking. Next to them are three speech bubbles with a  grey funnel tornado in each. Inside the biggest speech bubble in the middle, next to the tornado, is a yellow exclamation mark">
          <figcaption>
            <span class="caption">tornados are my special interest</span>
            <span class="credit"> | by RC.</span>
          </figcaption>
        </figure>





      </div>
    </div>


    <p><a href="/Disability/disability.html">back.</a></p>

  </center>

</html>

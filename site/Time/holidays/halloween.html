<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="/favicon.png" />
  <title>AAC Image Library</title>

  <!-- The style.css file allows you to change the look of your web pages.
         If you include the next line in all your web pages, they will all share the same look.
         This makes it easier to make new pages for your site. -->
  <link href="/style.css" rel="stylesheet" type="text/css" media="all">
  <style>
    body {
      background-color: #cccccc;
      /* For browsers that do not support gradients */
    }


    /* Responsive layout - when the screen is less than 600px wide, make the three columns stack on top of each other instead of next to each other */
    @media screen and (max-width: 600px) {
      .column {
        width: 100%;
      }
    }

    .row {
      display: flex;
    }

    .column {
      flex: 33%;
    }


    figure {
      border: 1px #cccccc solid;
      padding: 4px;
      margin: auto;
    }

    figcaption {
      background-color: black;
      color: white;
      padding: 2px;
      text-align: center;
    }
  </style>
</head>

<body>

  <p><a href="/Time/time">click here to go back.</a></p>


  <center>


    <div class="row">
      <div class="column">



      

        

    <figure>
          <img src="/Time/holidays/allergy treat basket rc.png" height="300" alt="a teal pumpkin shaped basket with a classic jack-o-lantern face on it">
          <figcaption>
            <span class="caption">allergy treat basket</span>
            <span class="credit"> | by Bear.</span>
          </figcaption>
        </figure>
        
        <figure>
          <img src="/Objects/candy bucket rae.png" height="300" alt=" Jack o lantern shaped object with an opening and a thin black handle.">
          <figcaption>
            <span class="caption">candy bucket</span>
            <span class="credit"> | By Rae.</span>
          </figcaption>
        </figure>
        
        <figure>
          <img src="/Phrases/trick or treat vixen.png" height="300" alt="a red devil mask on the top left corner, on the bottom right corner there is wrapped candy. The word 'or' is written between them in red.">
          <figcaption>
            <span class="caption">trick or treat</span>
            <span class="credit"> | by Vixen.</span>
          </figcaption>
        </figure>



      </div>
      <div class="column">





     
        <figure>
          <img src="/Objects/food/candy corn rae.png" height="300" alt="a single piece of candy corn.">
          <figcaption>
            <span class="caption">candy corn</span>
            <span class="credit"> | By Rae.</span>
          </figcaption>
        </figure>

    <figure>
          <img src="/Time/holidays/hand out candy rc.png" height="300" alt="two emoji-yellow outstretched hands with a blue arrow pointing down to various pieces of candy">
          <figcaption>
            <span class="caption">hand out candy</span>
            <span class="credit"> | by Bear.</span>
          </figcaption>
        </figure>
        
        <figure>
          <img src="/Time/holidays/trick or treating bh.png" height="300" alt="two kids dressed up. One is a pink fairy with a decorated wheelchair and the other is a ghost with a purple AAC tablet. The ghost kid asks, “trick or treat?” shown with a skull and a candy">
          <figcaption>
            <span class="caption">trick or treating</span>
            <span class="credit"> | by Blackholemojis.</span>
          </figcaption>
        </figure>






      </div>
      <div class="column">




        <figure>
          <img src="/Objects/halloween candy basket.png" height="300" alt=" a festive Halloween-themed pumpkin bucket filled with candy. The pumpkin has a carved jack-o'-lantern face, featuring closed, happy eyes and a broad, cheerful grin. The bucket’s handle is gray, contrasting with the bright orange pumpkin. Inside, various wrapped candies in green, pink, and white are visible.">
          <figcaption>
            <span class="caption">Halloween candy basket</span>
            <span class="credit"> | By Vixen.</span>
          </figcaption>
        </figure>

      <figure>
          <img src="/Time/holidays/jack o lantern lit mikey.png" height="300" alt="a lit, smiling jack-o'-lantern with two leaves beside it.">
          <figcaption>
            <span class="caption">jack-o'-lantern</span>
            <span class="credit"> | By Mikey.</span>
          </figcaption>
        </figure>

      <figure>
          <img src="/Time/holidays/treat basket rc.png" height="300" alt="an orange pumpkin shaped basket with a classic jack-o-lantern face on it">
          <figcaption>
            <span class="caption">treat basket</span>
            <span class="credit"> | by Bear.</span>
          </figcaption>
        </figure>



      </div>
    </div>


    <p><a href="/Time/time">back.</a></p>

  </center>

  <script src="https://website-widgets.pages.dev/dist/sienna.min.js" defer></script>


</body>

</html>

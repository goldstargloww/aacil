<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="/favicon.png" />
  <title>AAC Image Library</title>

  <!-- The style.css file allows you to change the look of your web pages.
         If you include the next line in all your web pages, they will all share the same look.
         This makes it easier to make new pages for your site. -->
  <link href="/style.css" rel="stylesheet" type="text/css" media="all">
  <style>
    /* Responsive layout - when the screen is less than 600px wide, make the three columns stack on top of each other instead of next to each other */
    @media screen and (max-width: 600px) {
      .column {
        width: 100%;
      }
    }

    .row {
      display: flex;
    }

    .column {
      flex: 33%;
    }


    figure {
      border: 1px #cccccc solid;
      padding: 4px;
      margin: auto;
    }

    figcaption {
      background-color: black;
      color: white;
      padding: 2px;
      text-align: center;
    }
  </style>
</head>

<body>

  <p><a href="https://aacil.neocities.org/Nature/animals">click here to go back.</a></p>


  <center>


    <div class="row">
      <div class="column">







        <figure>
          <img src="/Nature/animals/parts/antler 5 guys.png" height="300" alt="a brown deer antler">
          <figcaption>
            <span class="caption">antler</span>
            <span class="credit"> | By The Five (+) Guys Collective.</span>
          </figcaption>
        </figure>

          <figure>
          <img src="/Nature/animals/parts/ear 5 guys.png" height="300" alt="a brown and white cat ear">
          <figcaption>
            <span class="caption">ear</span>
            <span class="credit"> | By The Five (+) Guys Collective.</span>
          </figcaption>
        </figure>









      </div>
      <div class="column">






     
        <figure>
          <img src="/Nature/animals/parts/bone 5 guys.png" height="300" alt="a white femur">
          <figcaption>
            <span class="caption">bone</span>
            <span class="credit"> | By The Five (+) Guys Collective.</span>
          </figcaption>
        </figure>

            <figure>
          <img src="/Nature/animals/parts/eye 5 guys.png" height="300" alt="a yellow cat eye with a slit pupil">
          <figcaption>
            <span class="caption">eye</span>
            <span class="credit"> | By The Five (+) Guys Collective.</span>
          </figcaption>
        </figure>







      </div>
      <div class="column">




        <figure>
          <img src="/Nature/animals/parts/claw 5 guys.png" height="300" alt="a white cat paw with unsheathed claws">
          <figcaption>
            <span class="caption">claw</span>
            <span class="credit"> | By The Five (+) Guys Collective.</span>
          </figcaption>
        </figure>

              <figure>
          <img src="/Nature/animals/parts/face 5 guys.png" height="300" alt="a grey and white cat's head, with a red outline on his face and a red arrow pointing to the outline.">
          <figcaption>
            <span class="caption">face</span>
            <span class="credit"> | By The Five (+) Guys Collective.</span>
          </figcaption>
        </figure>
  




      </div>
    </div>



    <p><a href="https://aacil.neocities.org/Nature/animals">back.</a></p>

  </center>

</body>

<!DOCTYPE html>
<html>
  <head>
    <title>Disability Organizations | AAC Image Library</title>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <link href="/assets/favicon.png" rel="icon" type="image/png">
    <link href="/style.css" rel="stylesheet">
  </head>
  <body>
    <div class="symbol-container">
      <figure>
        <img alt="A drawing of the logo of inclusive education organisation All Means All, which is a light blue circle with very light blue and white text that says 'all means all'" src="/assets/symbols/all means all 1.png">
        <figcaption>
          <div>
            <span class="caption">All Means All</span>
            <span class="credit">by M</span>
          </div>
        </figcaption>
      </figure>
      <figure>
        <img alt="Three black candles of diffferent heights with dark red flames." src="/assets/symbols/disability memorial m.png">
        <figcaption>
          <div>
            <span class="caption">disability-memorial.org</span>
            <span class="credit">by M</span>
          </div>
        </figcaption>
      </figure>
      <figure>
        <img alt="A drawing of the logo of inclusive education organisation All Means All, which is a light blue circle with very light blue and white text that says 'all means all'. the text has been given a black outline" src="/assets/symbols/all means all 2.png">
        <figcaption>
          <div>
            <span class="caption">All Means All</span>
            <span class="credit">by M</span>
          </div>
        </figcaption>
      </figure>
      <figure>
        <img alt="a blue puzzle piece vaguely shaped like a person" src="/assets/symbols/autism speaks ot.png">
        <figcaption>
          <div>
            <span class="caption">Autism Speaks</span>
            <span class="credit">by Ottertime</span>
          </div>
        </figcaption>
      </figure>
      <figure>
        <img alt="A drawing of the logo of the Queensland Collective for Inclusive Education, which is warm-toned and shows overlapping lines and four circles in a design similar to the Indigenous Australian art symbol for a gathering place" src="/assets/symbols/queensland collective for inclusive education.png">
        <figcaption>
          <div>
            <span class="caption">Queensland Collective for Inclusive Education</span>
            <span class="credit">by M</span>
          </div>
        </figcaption>
      </figure>
      <figure>
        <img alt="A drawing of the logo of Women With Disabilties Australia, which is a lot of tiny purple shapes of women with different disabilities making up the shape of Australia." src="/assets/symbols/wwda.png">
        <figcaption>
          <div>
            <span class="caption">Women With Disabilities Australia</span>
            <span class="credit">by M</span>
          </div>
        </figcaption>
      </figure>
    </div>
  </body>
</html>
